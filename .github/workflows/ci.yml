name: CI

on:
  pull_request:
  push:

jobs:
  unit:
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/unit -q
      - run: ruff check .
      - run: ruff format --check .
