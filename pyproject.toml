[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frameguard"
version = "0.1.0"
description = "Offline, evidence-first video QA CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.16",
]

[project.scripts]
frameguard = "frameguard.cli:main"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
  "detector: requires native detector behavior delivered after M1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
ignore = ["TRY004"]
